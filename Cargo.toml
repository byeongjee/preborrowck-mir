[package]
name = "preborrowck-mir"
version = "0.0.0"
edition = "2024"
description = "the MIR rustc borrow checks, kept across crates"
license = "MIT OR Apache-2.0"

[features]
test = ["rustc_utils/test"]

[dependencies]
rustc_utils = "=0.15.0-nightly-2026-05-01"

[dev-dependencies]
preborrowck-mir = { path = ".", features = ["test"] }

[package.metadata.rust-analyzer]
rustc_private = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
